<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="oldBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#e8e8e8"/>
      <stop offset="100%" style="stop-color:#d0d0d0"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="800" height="600" fill="url(#oldBg)"/>
  <!-- Old-style header -->
  <rect x="0" y="0" width="800" height="80" fill="#2a5298"/>
  <text x="40" y="50" font-family="Times New Roman, serif" font-size="28" fill="#fff">Houston Family Dental</text>
  <!-- Old navigation -->
  <text x="500" y="50" font-family="Arial" font-size="14" fill="#ccc">Home | About | Services | Contact</text>
  <!-- Outdated content area -->
  <rect x="40" y="100" width="350" height="250" fill="#fff" stroke="#999" stroke-width="1"/>
  <text x="60" y="140" font-family="Times New Roman" font-size="18" fill="#333">Welcome to Our Practice</text>
  <text x="60" y="170" font-family="Arial" font-size="12" fill="#666">We offer dental services for</text>
  <text x="60" y="190" font-family="Arial" font-size="12" fill="#666">the whole family. Call us today!</text>
  <rect x="60" y="220" width="120" height="35" fill="#2a5298"/>
  <text x="80" y="243" font-family="Arial" font-size="12" fill="#fff">Call Now</text>
  <!-- Old sidebar -->
  <rect x="410" y="100" width="350" height="250" fill="#f5f5f5" stroke="#ccc"/>
  <text x="430" y="130" font-family="Arial" font-size="14" fill="#666">Our Services:</text>
  <text x="430" y="160" font-family="Arial" font-size="12" fill="#888">• General Dentistry</text>
  <text x="430" y="180" font-family="Arial" font-size="12" fill="#888">• Cosmetic Procedures</text>
  <text x="430" y="200" font-family="Arial" font-size="12" fill="#888">• Emergency Care</text>
  <!-- Footer -->
  <rect x="0" y="520" width="800" height="80" fill="#333"/>
  <text x="40" y="560" font-family="Arial" font-size="11" fill="#999">© 2015 Houston Family Dental. All rights reserved.</text>
  <!-- "BEFORE" watermark -->
  <text x="400" y="450" font-family="Arial Black" font-size="60" fill="rgba(0,0,0,0.1)" text-anchor="middle">BEFORE</text>
