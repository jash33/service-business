<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="modernLawBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8fafc"/>
      <stop offset="100%" style="stop-color:#f1f5f9"/>
    </linearGradient>
    <linearGradient id="navyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a5f"/>
      <stop offset="100%" style="stop-color:#0f172a"/>
    </linearGradient>
    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#d4a574"/>
      <stop offset="100%" style="stop-color:#b8956e"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="800" height="600" fill="url(#modernLawBg)"/>
  <!-- Modern header -->
  <rect x="0" y="0" width="800" height="80" fill="#fff"/>
  <rect x="40" y="25" width="4" height="30" fill="url(#goldAccent)"/>
  <text x="55" y="45" font-family="Inter, sans-serif" font-size="20" font-weight="700" fill="#0f172a">HOUSTON</text>
  <text x="55" y="62" font-family="Inter" font-size="12" fill="#64748b" letter-spacing="3">LAW GROUP</text>
  <!-- Modern nav -->
  <text x="350" y="45" font-family="Inter" font-size="14" fill="#475569">Practice Areas</text>
  <text x="470" y="45" font-family="Inter" font-size="14" fill="#475569">Our Team</text>
  <text x="570" y="45" font-family="Inter" font-size="14" fill="#475569">Results</text>
  <rect x="660" y="25" width="110" height="40" rx="4" fill="url(#navyGrad)"/>
  <text x="680" y="50" font-family="Inter" font-size="13" font-weight="600" fill="#fff">Contact Us</text>
  <!-- Hero section -->
  <rect x="0" y="80" width="450" height="340" fill="url(#navyGrad)"/>
