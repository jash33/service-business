  <text x="50" y="170" font-family="Inter" font-size="14" fill="#d4a574" font-weight="600" letter-spacing="2">HOUSTON'S TRUSTED ADVOCATES</text>
  <text x="50" y="220" font-family="Inter" font-size="38" font-weight="800" fill="#fff">Fighting For</text>
  <text x="50" y="270" font-family="Inter" font-size="38" font-weight="800" fill="#fff">Your Rights</text>
  <text x="50" y="310" font-family="Inter" font-size="15" fill="#94a3b8">Award-winning legal representation with</text>
  <text x="50" y="335" font-family="Inter" font-size="15" fill="#94a3b8">over 25 years of proven results.</text>
  <rect x="50" y="360" width="170" height="48" rx="4" fill="url(#goldAccent)"/>
  <text x="80" y="390" font-family="Inter" font-size="14" font-weight="600" fill="#0f172a">Free Consultation</text>
  <rect x="240" y="360" width="140" height="48" rx="4" fill="none" stroke="#fff" stroke-width="2"/>
  <text x="268" y="390" font-family="Inter" font-size="14" font-weight="600" fill="#fff">Our Results</text>
  <!-- Image/trust area -->
  <rect x="490" y="120" width="270" height="260" rx="8" fill="#fff"/>
  <text x="625" y="200" font-family="Inter" font-size="60" text-anchor="middle">⚖️</text>
  <text x="625" y="260" font-family="Inter" font-size="16" font-weight="600" fill="#0f172a" text-anchor="middle">$50M+ Recovered</text>
  <text x="625" y="285" font-family="Inter" font-size="13" fill="#64748b" text-anchor="middle">For our clients in 2023</text>
  <rect x="530" y="310" width="190" height="50" rx="8" fill="#f8fafc"/>
  <text x="560" y="340" font-family="Inter" font-size="24" fill="#d4a574">★★★★★</text>
  <!-- Practice areas -->
  <rect x="40" y="440" width="170" height="130" rx="12" fill="#fff"/>
  <circle cx="70" cy="475" r="20" fill="#fef3c7"/>
  <text x="70" y="482" font-family="Inter" font-size="18" text-anchor="middle">⚡</text>
  <text x="50" y="520" font-family="Inter" font-size="14" font-weight="600" fill="#0f172a">Personal Injury</text>
  <text x="50" y="540" font-family="Inter" font-size="11" fill="#64748b">Car accidents, medical</text>
  <text x="50" y="555" font-family="Inter" font-size="11" fill="#64748b">malpractice & more</text>

  <rect x="230" y="440" width="170" height="130" rx="12" fill="#fff"/>
  <circle cx="260" cy="475" r="20" fill="#dbeafe"/>
  <text x="260" y="482" font-family="Inter" font-size="18" text-anchor="middle">👨‍👩‍👧</text>
  <text x="240" y="520" font-family="Inter" font-size="14" font-weight="600" fill="#0f172a">Family Law</text>
  <text x="240" y="540" font-family="Inter" font-size="11" fill="#64748b">Divorce, custody, and</text>
  <text x="240" y="555" font-family="Inter" font-size="11" fill="#64748b">family matters</text>

  <rect x="420" y="440" width="170" height="130" rx="12" fill="#fff"/>
  <circle cx="450" cy="475" r="20" fill="#fee2e2"/>
  <text x="450" y="482" font-family="Inter" font-size="18" text-anchor="middle">🛡️</text>
  <text x="430" y="520" font-family="Inter" font-size="14" font-weight="600" fill="#0f172a">Criminal Defense</text>
  <text x="430" y="540" font-family="Inter" font-size="11" fill="#64748b">Aggressive defense for</text>
  <text x="430" y="555" font-family="Inter" font-size="11" fill="#64748b">all charges</text>

  <rect x="610" y="440" width="150" height="130" rx="12" fill="url(#navyGrad)"/>
  <text x="685" y="500" font-family="Inter" font-size="14" font-weight="600" fill="#fff" text-anchor="middle">View All</text>
  <text x="685" y="525" font-family="Inter" font-size="14" font-weight="600" fill="#fff" text-anchor="middle">Practice Areas</text>
  <text x="685" y="550" font-family="Inter" font-size="16" fill="#d4a574" text-anchor="middle">→</text>
  <!-- AFTER watermark -->
  <text x="400" y="580" font-family="Arial Black" font-size="50" fill="rgba(30,58,95,0.05)" text-anchor="middle">AFTER</text>
