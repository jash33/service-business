<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="modernFloralBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fdf2f8"/>
      <stop offset="100%" style="stop-color:#fff1f2"/>
    </linearGradient>
    <linearGradient id="pinkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ec4899"/>
      <stop offset="100%" style="stop-color:#db2777"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="800" height="600" fill="url(#modernFloralBg)"/>
  <!-- Modern header -->
  <rect x="0" y="0" width="800" height="70" fill="#fff"/>
  <text x="40" y="42" font-family="Inter, sans-serif" font-size="22" font-weight="700" fill="#831843">bloom.</text>
  <text x="40" y="58" font-family="Inter" font-size="10" fill="#be185d" letter-spacing="2">HOUSTON FLORIST</text>
  <!-- Modern nav -->
  <text x="400" y="40" font-family="Inter" font-size="14" fill="#64748b">Shop</text>
  <text x="470" y="40" font-family="Inter" font-size="14" fill="#64748b">Occasions</text>
  <text x="560" y="40" font-family="Inter" font-size="14" fill="#64748b">Subscribe</text>
  <rect x="650" y="20" width="110" height="40" rx="20" fill="url(#pinkGrad)"/>
  <text x="680" y="46" font-family="Inter" font-size="13" font-weight="600" fill="#fff">Order Now</text>
  <!-- Hero section -->
  <rect x="0" y="70" width="800" height="300" fill="#fff"/>
  <rect x="420" y="70" width="380" height="300" fill="#fce7f3"/>
  <text x="60" y="150" font-family="Inter" font-size="40" font-weight="800" fill="#831843">Fresh Blooms</text>
  <text x="60" y="200" font-family="Inter" font-size="40" font-weight="800" fill="#831843">Delivered Daily</text>
  <text x="60" y="250" font-family="Inter" font-size="16" fill="#9d174d">Handcrafted arrangements for every</text>
  <text x="60" y="275" font-family="Inter" font-size="16" fill="#9d174d">occasion. Same-day delivery in Houston.</text>
  <rect x="60" y="300" width="150" height="50" rx="25" fill="url(#pinkGrad)"/>
  <text x="100" y="332" font-family="Inter" font-size="14" font-weight="600" fill="#fff">Shop Now</text>
  <rect x="230" y="300" width="130" height="50" rx="25" fill="none" stroke="#ec4899" stroke-width="2"/>
  <text x="255" y="332" font-family="Inter" font-size="14" font-weight="600" fill="#ec4899">Subscribe</text>
  <!-- Hero image area with flowers -->
  <circle cx="610" cy="220" r="100" fill="#fbcfe8" opacity="0.5"/>
  <text x="575" y="200" font-family="Inter" font-size="80">🌸</text>
  <text x="650" y="260" font-family="Inter" font-size="50">🌺</text>
  <text x="520" y="280" font-family="Inter" font-size="40">🌷</text>
  <!-- Product cards -->
  <rect x="40" y="390" width="220" height="180" rx="16" fill="#fff"/>
  <rect x="50" y="400" width="200" height="100" rx="12" fill="#fce7f3"/>
  <text x="150" y="460" font-family="Inter" font-size="36" text-anchor="middle">🌹</text>
  <text x="60" y="525" font-family="Inter" font-size="14" font-weight="600" fill="#831843">Rose Collection</text>
  <text x="60" y="545" font-family="Inter" font-size="12" fill="#9d174d">From $39</text>
  <text x="200" y="545" font-family="Inter" font-size="12" fill="#ec4899">→</text>

  <rect x="290" y="390" width="220" height="180" rx="16" fill="#fff"/>
  <rect x="300" y="400" width="200" height="100" rx="12" fill="#dbeafe"/>
  <text x="400" y="460" font-family="Inter" font-size="36" text-anchor="middle">💐</text>
  <text x="310" y="525" font-family="Inter" font-size="14" font-weight="600" fill="#831843">Mixed Bouquets</text>
  <text x="310" y="545" font-family="Inter" font-size="12" fill="#9d174d">From $49</text>
  <text x="450" y="545" font-family="Inter" font-size="12" fill="#ec4899">→</text>

  <rect x="540" y="390" width="220" height="180" rx="16" fill="#fff"/>
  <rect x="550" y="400" width="200" height="100" rx="12" fill="#dcfce7"/>
  <text x="650" y="460" font-family="Inter" font-size="36" text-anchor="middle">🪴</text>
  <text x="560" y="525" font-family="Inter" font-size="14" font-weight="600" fill="#831843">Plants & Succulents</text>
  <text x="560" y="545" font-family="Inter" font-size="12" fill="#9d174d">From $29</text>
  <text x="700" y="545" font-family="Inter" font-size="12" fill="#ec4899">→</text>
  <!-- AFTER watermark -->
  <text x="400" y="560" font-family="Arial Black" font-size="60" fill="rgba(236,72,153,0.06)" text-anchor="middle">AFTER</text>
</svg>
